name: timetable

# 시간표(busv3). 매시간:
#  1) 55분 동안 2분마다 칠곡·대구 버스정보시스템을 받아 임시 파일에 모은다(busv3.collect) - TAGO 가 빠뜨리는 버스도 남기려고
#  2) Worker KV 의 TAGO 5분 수집을 가져오고, 둘을 합쳐 도착·시간표를 만들어 v3/data 에 커밋한다(busv3.update)
# GitHub 예약 실행(cron)은 늦거나 빠지는 일이 잦다(10/25 12~13시 한 번도 안 돎). 그래서 시작하자마자 다음 실행을 직접 예약해
# 이어 달리기로 돈다(같은 그룹이라 이번 실행이 끝나야 시작). cron 은 끊겼을 때 다시 잇는 용도.
# 밤(21시 이후 시작한 실행)에는 다음 실행 대신 '아침 기다리기'(mode=wait)를 예약한다: 06시까지 자다가(한 번에 최대 5시간,
# 넘으면 기다리기를 한 번 더 이어서) 06시에 수집을 시작한다. 10/27~29 cron 이 06~08시에 한 번도 안 돌아 출근 시간 기록이 빠졌다.
# 원본 앱 저장소(dyson-git/chilgok-bus-eta)의 PC 수집 기록은 받아서 읽기만 한다. 올리는 사이 다른 커밋이 끼면 새로 받아 처음부터 다시(최대 3번).
on:
  schedule:
    - cron: "0 21-23,0-12 * * *"   # 한국 06~21시 정각(그 한 시간을 받는다)
  workflow_dispatch:
    inputs:
      minutes:
        description: "버스정보시스템을 받을 시간(분)"
        default: "55"
      mode:
        description: "collect(수집) | wait(한국 06시까지 기다렸다가 수집 시작)"
        default: "collect"

permissions:
  contents: write
  actions: write

concurrency:
  group: timetable
  cancel-in-progress: false

jobs:
  wait:
    if: github.event.inputs.mode == 'wait'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Sleep until 06:00 KST, then start collecting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "06:00" +%s)
          [ "$target" -le "$now" ] && target=$(TZ=Asia/Seoul date -d "tomorrow 06:00" +%s)
          left=$((target - now))
          # 이미 06~21시면 바로 수집
          h=$(TZ=Asia/Seoul date +%H)
          if [ "$h" -ge 6 ] && [ "$h" -lt 21 ]; then left=0; fi
          if [ "$left" -gt 18000 ]; then
            sleep 18000
            gh workflow run timetable.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=wait
          else
            sleep "$left"
            gh workflow run timetable.yml -R "$GITHUB_REPOSITORY" --ref main
          fi

  build:
    if: github.event.inputs.mode != 'wait'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Queue the next hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Seoul date +%H)
          if [ "$h" -ge 6 ] && [ "$h" -lt 21 ]; then gh workflow run timetable.yml -R "$GITHUB_REPOSITORY" --ref main || echo "queue failed"
          else gh workflow run timetable.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=wait || echo "queue failed"; fi
      - name: Collect bus info systems
        run: python -m busv3.collect "$RUNNER_TEMP/bis.jsonl" "${{ github.event.inputs.minutes || '55' }}" 120
      - name: Fetch original app records (read only)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/dyson-git/chilgok-bus-eta "$RUNNER_TEMP/orig"
          git -C "$RUNNER_TEMP/orig" sparse-checkout set data/observations
      - name: Build and commit timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            mkdir -p orig && rm -rf orig/data && cp -r "$RUNNER_TEMP/orig/data" orig/data
            python -m busv3.update --bis "$RUNNER_TEMP/bis.jsonl"
            git add data
            if git diff --cached --quiet -- data/obs data/bis data/raw data/arrivals.json data/stats.json; then echo "no change"; exit 0; fi
            git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
            if git push origin HEAD:main; then exit 0; fi
            echo "push raced (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
